  <style>
    :root {
      --brand: #78866B; --brand-dark: #3B4B3C; --brand-soft: #F1F6F0; --brand-line: #E2ECE0;
      --accent: #556B2F; --accent-dark: #455822;
      --ink: #1A1D21; --ink-sub: #555555; --bg: #FAF8F5; --line: #EBE7E0; --danger: #C0392B;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; background: #ffffff; color: var(--ink);
      font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      font-size: 16px; line-height: 1.7; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    button { font-family: inherit; }
    [hidden] { display: none !important; }
    .site-chrome, .site-footer { display: contents; } /* 감싸는 상자 없이 그대로 배치 (sticky 머리글 유지) */

    /* ---------- 본문 ---------- */
    .nt-main { padding: 48px 0 112px; }
    .nt-wrap { max-width: 880px; margin: 0 auto; padding: 0 28px; }

    .nt-head { margin-bottom: 28px; }
    .nt-title { margin: 0 0 10px; font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.35; }
    .nt-sub { margin: 0; font-size: 16px; line-height: 1.7; color: var(--ink-sub); word-break: keep-all; }

    /* 검색창 */
    .nt-search { position: relative; margin: 28px 0 18px; }
    .nt-search input {
      width: 100%; box-sizing: border-box; padding: 14px 18px 14px 46px; border: 1.5px solid #D9DED5;
      border-radius: 9999px; font-size: 16px; font-family: inherit; color: var(--ink); background: #FBFCFA;
      transition: border-color .15s, background .15s;
    }
    .nt-search input:focus { outline: none; border-color: var(--accent); background: #ffffff; }
    .nt-search svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); pointer-events: none; }

    /* 카테고리 탭 */
    .nt-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .nt-tab {
      padding: 10px 20px; border: 1.5px solid var(--brand-line); border-radius: 9999px; background: #ffffff;
      color: #3B4335; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s, color .15s, border-color .15s;
      min-height: 44px;
    }
    .nt-tab:hover { background: var(--brand-soft); }
    .nt-tab.is-active { background: var(--accent); border-color: var(--accent); color: #ffffff; }
    .nt-tab:focus-visible { outline: 3px solid rgba(85,107,47,.5); outline-offset: 2px; }

    /* 아코디언 리스트 */
    .nt-list { display: flex; flex-direction: column; gap: 10px; }
    .nt-item {
      border: 1.5px solid var(--line); border-radius: 16px; background: #ffffff; overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }
    .nt-item.is-pinned { border-color: #F1E2B5; background: #FFFDF5; }
    .nt-item.is-open { border-color: var(--brand-line); box-shadow: 0 4px 16px rgba(0,0,0,.05); }

    .nt-item-head {
      width: 100%; display: flex; align-items: center; gap: 14px; padding: 18px 22px; background: none;
      border: none; text-align: left; cursor: pointer; font-family: inherit;
    }
    .nt-badges { display: flex; gap: 6px; flex: none; }
    .nt-badge {
      display: inline-block; padding: 4px 11px; border-radius: 9999px; font-size: 13px; font-weight: 800; white-space: nowrap;
    }
    .nt-badge.must { background: #FDE2E2; color: #B3261E; }
    .nt-badge.important { background: #FFF1CC; color: #7A5600; }
    .nt-badge.category { background: var(--brand-soft); color: var(--accent-dark); }

    .nt-item-title-wrap { flex: 1 1 auto; min-width: 0; }
    .nt-item-title { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.5; word-break: keep-all; color: var(--ink); }
    .nt-item-date { display: block; margin-top: 4px; font-size: 14px; color: var(--ink-sub); }

    .nt-chevron { flex: none; transition: transform .25s ease; color: #8B95A1; }
    .nt-item.is-open .nt-chevron { transform: rotate(180deg); color: var(--accent); }

    .nt-item-body { height: 0; overflow: hidden; transition: height .3s ease; }
    .nt-item-body-inner {
      padding: 0 22px 22px; font-size: 16px; line-height: 1.75; color: #333d33; word-break: keep-all;
      border-top: 1px solid var(--line); padding-top: 18px;
    }
    .nt-item-body-inner p { margin: 0 0 12px; }
    .nt-item-body-inner p:last-child { margin-bottom: 0; }

    .nt-empty {
      display: none; padding: 64px 20px; text-align: center; color: var(--ink-sub); font-size: 16px;
    }
    .nt-empty.is-visible { display: block; }

    /* index.html 헤더/푸터와 동일하게 렌더링되도록 보정 (index 는 Tailwind preflight 적용) */
    header, footer { letter-spacing: normal; line-height: 1.5; }
    footer h3 { margin-top: 0; }

    @media (max-width: 720px) {
      .nt-main { padding: 28px 0 80px; }
      .nt-wrap { padding: 0 20px; }
      .nt-title { font-size: 25px; }
      .nt-item-head { padding: 16px 16px; gap: 10px; }
      .nt-item-body-inner { padding: 0 16px 18px; }
      .nt-item-body-inner { padding-top: 16px; }
    }
  </style>

<script>
(function () {
  'use strict';

  // 공지 데이터는 Supabase notices 테이블(sql/notices_management.sql)에서 불러옵니다 — admin.html
  // '공지사항 관리' 카드(js/admin-notices.js)에서 등록/수정/삭제한 내용이 그대로 반영됩니다.
  // pinned 로 표시한 항목은 목록 맨 위에 고정되고 [필독]/[중요] 뱃지가 붙습니다.
  var NOTICES = [];

  var CATEGORY_LABEL = { service: '서비스 안내', maintenance: '시스템 점검', event: '이벤트' };
  var BADGE_LABEL = { must: '필독', important: '중요' };

  var listEl = document.getElementById('ntList');
  var emptyEl = document.getElementById('ntEmpty');
  var searchInput = document.getElementById('ntSearchInput');
  var tabsEl = document.getElementById('ntTabs');

  var state = { category: 'all', query: '' };

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function matches(notice) {
    if (state.category !== 'all' && notice.category !== state.category) return false;
    if (!state.query) return true;
    var q = state.query.toLowerCase();
    var haystack = (notice.title + ' ' + notice.body.join(' ')).toLowerCase();
    return haystack.indexOf(q) !== -1;
  }

  function sortedNotices() {
    var pinned = NOTICES.filter(function (n) { return n.pinned; });
    var rest = NOTICES.filter(function (n) { return !n.pinned; });
    return pinned.concat(rest);
  }

  function render() {
    var items = sortedNotices().filter(matches);
    listEl.innerHTML = '';

    if (items.length === 0) {
      emptyEl.classList.add('is-visible');
    } else {
      emptyEl.classList.remove('is-visible');
    }

    items.forEach(function (notice) {
      var item = document.createElement('div');
      item.className = 'nt-item' + (notice.pinned ? ' is-pinned' : '');
      item.dataset.id = notice.id;

      var badgesHtml = '';
      if (notice.badge) {
        badgesHtml += '<span class="nt-badge ' + notice.badge + '">' + BADGE_LABEL[notice.badge] + '</span>';
      }
      badgesHtml += '<span class="nt-badge category">' + CATEGORY_LABEL[notice.category] + '</span>';

      var bodyHtml = notice.body.map(function (p) { return '<p>' + escapeHtml(p) + '</p>'; }).join('');

      item.innerHTML =
        '<button type="button" class="nt-item-head" aria-expanded="false">' +
          '<span class="nt-badges">' + badgesHtml + '</span>' +
          '<span class="nt-item-title-wrap">' +
            '<span class="nt-item-title">' + escapeHtml(notice.title) + '</span>' +
            '<span class="nt-item-date">' + notice.date + '</span>' +
          '</span>' +
          '<svg class="nt-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>' +
        '</button>' +
        '<div class="nt-item-body"><div class="nt-item-body-inner">' + bodyHtml + '</div></div>';

      listEl.appendChild(item);
    });
  }

  function toggleItem(item) {
    var isOpen = item.classList.contains('is-open');
    var body = item.querySelector('.nt-item-body');
    var head = item.querySelector('.nt-item-head');

    if (isOpen) {
      body.style.height = body.scrollHeight + 'px';
      requestAnimationFrame(function () { body.style.height = '0px'; });
      item.classList.remove('is-open');
      head.setAttribute('aria-expanded', 'false');
    } else {
      item.classList.add('is-open');
      head.setAttribute('aria-expanded', 'true');
      body.style.height = body.scrollHeight + 'px';
    }

    body.addEventListener('transitionend', function onEnd() {
      if (item.classList.contains('is-open')) body.style.height = 'auto';
      body.removeEventListener('transitionend', onEnd);
    });
  }

  listEl.addEventListener('click', function (e) {
    var head = e.target.closest ? e.target.closest('.nt-item-head') : null;
    if (!head) return;
    var item = head.closest('.nt-item');
    if (item) toggleItem(item);
  });

  tabsEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.nt-tab') : null;
    if (!btn) return;
    tabsEl.querySelectorAll('.nt-tab').forEach(function (t) {
      t.classList.remove('is-active');
      t.setAttribute('aria-selected', 'false');
    });
    btn.classList.add('is-active');
    btn.setAttribute('aria-selected', 'true');
    state.category = btn.dataset.category;
    render();
  });

  searchInput.addEventListener('input', function () {
    state.query = searchInput.value.trim();
    render();
  });

  function formatDateOnly(iso) {
    var d = iso ? new Date(iso) : null;
    if (!d || isNaN(d.getTime())) return '';
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  function mapRow(row) {
    return {
      id: row.id,
      pinned: !!row.pinned,
      badge: row.badge || null,
      category: row.category,
      title: row.title,
      date: formatDateOnly(row.created_at),
      body: String(row.body || '').split(/\n\s*\n/).filter(Boolean)
    };
  }

  async function loadNotices() {
    listEl.innerHTML = '<p class="nt-empty is-visible">공지사항을 불러오는 중…</p>';
    emptyEl.classList.remove('is-visible');

    var client = window.WBAuth && window.WBAuth.client;
    if (!client) {
      listEl.innerHTML = '';
      emptyEl.textContent = '공지사항을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
      emptyEl.classList.add('is-visible');
      return;
    }

    var res = await client
      .from('notices')
      .select('id, title, category, badge, pinned, body, created_at')
      .eq('is_published', true)
      .order('pinned', { ascending: false })
      .order('created_at', { ascending: false });

    listEl.innerHTML = '';

    if (res.error) {
      emptyEl.textContent = '공지사항을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
      emptyEl.classList.add('is-visible');
      return;
    }

    NOTICES = (res.data || []).map(mapRow);
    render();
  }

  loadNotices();
})();
</script>
