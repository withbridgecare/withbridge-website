  <!-- 롤링 동작 자바스크립트 -->
  <script>
    (function() {
      let currentIndex = 0;
      const track = document.getElementById('topBannerTrack');
      if (!track) return;
      const totalItems = track.children.length;

      setInterval(function() {
        currentIndex = (currentIndex + 1) % totalItems;
        track.style.transform = 'translateY(-' + (currentIndex * 38) + 'px)';
      }, 3500); // 3.5초마다 롤링
    })();
  </script>

  <!-- 04. 자바스크립트 (토글 및 Supabase 연동) -->
  <!-- ==================================================================== -->
  <script>
    // 다른 방식으로 로그인 토글 (SVG 회전 애니메이션 적용)
    function toggleOtherLogin() {
      const area = document.getElementById('otherLoginArea');
      const arrowSvg = document.getElementById('toggleArrowSvg');
      
      if (area.style.display === 'none' || area.style.display === '') {
        area.style.display = 'block';
        arrowSvg.style.transform = 'rotate(180deg)'; // 180도 회전
      } else {
        area.style.display = 'none';
        arrowSvg.style.transform = 'rotate(0deg)'; // 원위치
      }
    }

    // Supabase 클라이언트는 auth-header.js 가 만든 하나를 공유합니다 (헤더 상태와 항상 같은 세션을 봄)
    function getSupabase() {
      return window.WBAuth ? window.WBAuth.client : null;
    }

    // '예약하기' 등 로그인이 필요한 버튼이 ?redirect=apply.html 과 함께 이 페이지로 보냈다면,
    // 로그인을 마치고(카카오 OAuth 는 index.html 로 돌아오므로) 그 쪽으로 이어서 이동하도록 기억해 둡니다 (auth-header.js)
    (function () {
      var redirect = new URLSearchParams(window.location.search).get('redirect');
      if (redirect && window.WBAuth && window.WBAuth.rememberPostLoginRedirect) {
        window.WBAuth.rememberPostLoginRedirect(redirect);
      }
    })();

    // 카카오 로그인 · 회원가입 (버튼 위치와 상관없이 모두 이 함수를 거칩니다)
    async function loginWithKakao() {
      // 버튼 아래 안내 문구대로 '로그인 = 이용약관 동의'. 이 브라우저에 동의한 약관 버전만 기록합니다 (terms-modal.js)
      if (window.WBTerms) window.WBTerms.recordAgreement();

      const client = getSupabase();
      if (!client) {
        alert("Supabase SDK 로딩 중입니다. 잠시 후 다시 시도해 주세요.");
        return;
      }
      const redirectUrl = window.location.origin + '/index.html';
      // scopes: 'account_phone_number' 는 일시적으로 제거했습니다 — 카카오 디벨로퍼스 콘솔에서
      // 이 앱의 "비즈 앱" 전환 + 전화번호 동의항목 심사가 끝나지 않은 상태로 이 scope를 요청하면
      // 카카오가 KOE205(설정되지 않은 동의항목 요청)로 전체 로그인을 거부합니다.
      // 콘솔에서 해당 동의항목이 "승인" 상태가 된 뒤에만 다시 추가하세요. 전화번호가 없는 동안은
      // package.html 결제 시점의 1회 입력 플로우(set_initial_phone_if_missing)가 대신 처리합니다.
      const { data, error } = await client.auth.signInWithOAuth({
        provider: 'kakao',
        options: {
          redirectTo: redirectUrl
        }
      });
      if (error) alert("로그인 오류: " + error.message);
    }

    // ---------- 이메일/비밀번호 로그인 (회원가입은 signup.html 전용 페이지에서 처리) ----------
    var EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    var AUTH_PASSWORD_MIN_LENGTH = 8;

    function getAuthFormError() {
      return document.getElementById('authFormError');
    }
    function showAuthFormError(msg) {
      var el = getAuthFormError();
      if (el) { el.textContent = msg; el.style.display = 'block'; } else { alert(msg); }
    }
    function clearAuthFormError() {
      var el = getAuthFormError();
      if (el) { el.textContent = ''; el.style.display = 'none'; }
    }

    function readEmailPasswordInputs() {
      var emailEl = document.getElementById('authEmail');
      var passwordEl = document.getElementById('authPassword');
      return {
        email: (emailEl && emailEl.value || '').trim(),
        password: (passwordEl && passwordEl.value) || ''
      };
    }

    // 이메일 형식 + 비밀번호 8자 이상 규칙을 검사합니다.
    function validateEmailPassword(email, password) {
      if (!email || !EMAIL_PATTERN.test(email)) return '올바른 이메일 주소를 입력해 주세요.';
      if (!password || password.length < AUTH_PASSWORD_MIN_LENGTH) return '비밀번호는 ' + AUTH_PASSWORD_MIN_LENGTH + '자 이상이어야 합니다.';
      return null;
    }

    async function loginWithEmail() {
      clearAuthFormError();
      var input = readEmailPasswordInputs();
      var validationError = validateEmailPassword(input.email, input.password);
      if (validationError) { showAuthFormError(validationError); return; }

      var client = getSupabase();
      if (!client) { showAuthFormError('Supabase SDK 로딩 중입니다. 잠시 후 다시 시도해 주세요.'); return; }

      // 버튼 아래 안내 문구대로 '로그인 = 이용약관 동의' (카카오 로그인과 동일하게 처리)
      if (window.WBTerms) window.WBTerms.recordAgreement();

      var result = await client.auth.signInWithPassword({ email: input.email, password: input.password });
      if (result.error) {
        console.error('[이메일 로그인 오류]', result.error.message);
        showAuthFormError('이메일 또는 비밀번호가 올바르지 않습니다.');
        return;
      }
      // 세션이 생기면 아래 onAuthStateChange(SIGNED_IN) 핸들러가 어르신 정보 확인/이동을 이어서 처리합니다.
    }

    // 회원가입 처리 자체는 signup.html 전용 페이지로 분리했습니다 (이 페이지는 로그인만 담당).

    // 로그인 완료(이미 세션이 있거나 방금 SIGNED_IN) 시 바로 메인 페이지로 이동합니다.
    // '돌봄을 받으실 어르신 정보' 입력은 더 이상 로그인 직후 자동으로 묻지 않고, mypage.html 에서
    // 사용자가 직접 '어르신 추가 등록'을 눌렀을 때만 받습니다.
    function goToMain() {
      window.location.href = "index.html";
    }

    // 페이지 진입 시 로그인 세션 체크
    window.addEventListener('DOMContentLoaded', async () => {
      const client = getSupabase();
      if (!client) return;

      const { data: { session } } = await client.auth.getSession();
      if (session) {
        goToMain();
        return;
      }

      client.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session) goToMain();
      });
    });
  </script>
</body>
</html>
