    <p id="resetPwInvalidNotice" hidden style="font-size: 13.5px; color: #DC2626; line-height: 1.6; margin-bottom: 20px;">
      유효하지 않거나 만료된 링크입니다. 어드민(또는 로그인 화면)에서 비밀번호 재설정 메일을 다시 요청해 주세요.
    </p>

    <form id="resetPwForm" onsubmit="return false;" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; text-align: left;">

      <input type="password" id="resetPwConfirm" placeholder="새 비밀번호 확인" autocomplete="new-password" style="width: 100%; height: 48px; padding: 0 14px; border: 1px solid #E0E0E0; border-radius: 0px; font-size: 14px; outline: none; background-color: #ffffff; color: #1A1D21;">
    </form>

    <p id="resetPwError" style="display: none; margin: 0 0 14px; font-size: 12.5px; color: #DC2626; text-align: left; line-height: 1.5;"></p>
    <p id="resetPwSuccess" style="display: none; margin: 0 0 14px; font-size: 12.5px; color: #455822; text-align: left; line-height: 1.5;"></p>

    <button type="button" id="resetPwSubmitBtn" onclick="submitNewPassword()" style="width: 100%; height: 50px; background-color: #8FA482; color: #ffffff; border: none; padding: 0; border-radius: 0px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 14px;">

  <!-- ==================================================================== -->
  <!-- 03. 자바스크립트 (Supabase 비밀번호 재설정 연동) -->
  <!-- ==================================================================== -->
  <script>
    // Supabase 클라이언트는 auth-header.js 가 만든 하나를 공유합니다. 이 페이지는 admin.html의
    // [비밀번호 재설정 메일 발송](resetPasswordForEmail) 링크를 클릭해서 들어옵니다 — supabase-js
    // 가 기본 설정(detectSessionInUrl: true)으로 URL 의 recovery 토큰을 자동으로 읽어 임시 세션을
    // 만들어 주므로, 이 페이지는 그 세션이 있는지만 확인하고 있으면 auth.updateUser({ password })
    // 를 바로 호출합니다.
    function getSupabase() {
      return window.WBAuth ? window.WBAuth.client : null;
    }

    var RESET_PW_MIN_LENGTH = 8;
    var sessionReady = false;

    function showResetError(msg) {
      var el = document.getElementById('resetPwError');
      document.getElementById('resetPwSuccess').style.display = 'none';
      if (!msg) { el.style.display = 'none'; return; }
      el.textContent = msg;
      el.style.display = 'block';
    }
    function showResetSuccess(msg) {
      var el = document.getElementById('resetPwSuccess');
      document.getElementById('resetPwError').style.display = 'none';
      el.textContent = msg;
      el.style.display = 'block';
    }

    function showInvalidLink() {
      document.getElementById('resetPwInvalidNotice').hidden = false;
      document.getElementById('resetPwIntro').style.display = 'none';
      document.getElementById('resetPwForm').style.display = 'none';
      document.getElementById('resetPwSubmitBtn').style.display = 'none';
    }

    async function submitNewPassword() {
      if (!sessionReady) { showResetError('유효하지 않거나 만료된 링크입니다. 다시 요청해 주세요.'); return; }
      showResetError(null);

      var newPw = document.getElementById('resetPwNew').value || '';
      var confirmPw = document.getElementById('resetPwConfirm').value || '';
      if (!newPw || newPw.length < RESET_PW_MIN_LENGTH) { showResetError('비밀번호는 ' + RESET_PW_MIN_LENGTH + '자 이상이어야 합니다.'); return; }
      if (newPw !== confirmPw) { showResetError('비밀번호가 일치하지 않습니다.'); return; }

      var client = getSupabase();
      if (!client) { showResetError('Supabase SDK 로딩 중입니다. 잠시 후 다시 시도해 주세요.'); return; }

      var btn = document.getElementById('resetPwSubmitBtn');
      btn.disabled = true;
      try {
        var result = await client.auth.updateUser({ password: newPw });
        if (result.error) {
          console.error('[비밀번호 재설정 오류]', result.error.message);
          showResetError('비밀번호 변경에 실패했습니다: ' + result.error.message);
          return;
        }
        showResetSuccess('비밀번호가 변경되었습니다. 잠시 후 메인 화면으로 이동합니다.');
        document.getElementById('resetPwForm').style.display = 'none';
        btn.style.display = 'none';
        setTimeout(function () { window.location.href = 'index.html'; }, 1500);
      } finally {
        btn.disabled = false;
      }
    }

    (async function init() {
      // auth-header.js 가 window.WBAuth.client 를 만들 때까지 잠깐 기다립니다(SDK 로드 순서 보장).
      for (var attempt = 0; attempt < 100 && !getSupabase(); attempt++) {
        await new Promise(function (r) { setTimeout(r, 100); });
      }
      var client = getSupabase();
      if (!client) { showInvalidLink(); return; }

      var res = await client.auth.getSession();
      var session = res.data && res.data.session;
      if (!session) { showInvalidLink(); return; }
      sessionReady = true;
    })();
  </script>
