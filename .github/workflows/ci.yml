# 코드 점검 — main / dev_v1 / nextjs 브랜치에 push 하거나 PR 을 만들면 자동으로 실행됩니다.
# 실패하면 GitHub 의 PR 화면에 빨간 X 가 표시됩니다(합치기 전에 확인하세요).
# 실제 DB 에 연결하지 않으므로 Supabase 주소/키는 형식만 맞춘 가짜 값을 씁니다.
name: CI

on:
  push:
    branches: [main, dev_v1, nextjs]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 코드 규칙 점검 (ESLint)
        run: npm run lint
      - name: 타입 점검 (TypeScript)
        run: npm run typecheck
      - name: 빌드
        run: npm run build
