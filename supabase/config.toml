# 이 저장소에 Supabase CLI 프로젝트가 아직 연결되어 있지 않다면 `supabase init` / `supabase link`로
# project_id 등 나머지 설정을 채워 넣으세요. 여기서는 Edge Functions의 JWT 검증 여부만 명시합니다.

[functions.issue-virtual-account]
# 로그인한 보호자만 호출 가능 — Authorization 헤더의 Supabase 액세스 토큰을 게이트웨이가 먼저 검증합니다.
verify_jwt = true

[functions.confirm-extra-charge-payment]
# 로그인한 보호자만 호출 가능 — mypage.html 자체가 로그인 사용자 전용이라 issue-virtual-account 와 달리
# 비로그인 신청 경로는 없습니다.
verify_jwt = true

[functions.confirm-package-order-payment]
# 로그인한 보호자만 호출 가능 — 패키지 구매는 mypage.html(로그인 전용 화면)에서만 가능합니다.
verify_jwt = true

[functions.cancel-payment]
# 로그인한 관리자만 호출 가능 — 함수 내부에서 is_admin() RPC로 한 번 더 확인합니다(fail closed).
verify_jwt = true

[functions.admin-refund-application]
# 로그인한 관리자만 호출 가능 — cancel-payment 와 동일하게 함수 내부에서 profiles.role 을 직접
# 조회해 한 번 더 확인합니다(fail closed).
verify_jwt = true

[functions.portone-webhook]
# PortOne이 Supabase 로그인 토큰 없이 직접 호출하므로 꺼야 합니다. 대신 함수 내부에서
# PORTONE_WEBHOOK_SECRET 서명 검증 + PortOne API 재조회로 신뢰성을 확보합니다.
verify_jwt = false

[functions.submit-manager-application]
# 로그인한 지원자만 호출 가능 — manager-apply.html 의 지원서 제출 창구(연락처 중복/IP 레이트리밋/
# Turnstile 검증을 모두 이 함수가 수행한 뒤 service_role 로 insert 합니다. 자세한 내용은
# sql/manager_application_anti_abuse.sql, supabase/functions/submit-manager-application 참고).
verify_jwt = true

[functions.delete-account]
# 로그인한 본인만 호출 가능 — 함수 내부에서 auth.getUser() 로 토큰을 직접 검증하고, 그 토큰의
# 사용자 자신만 차단합니다(sql/profile_account_management.sql 의 deactivate_own_account() 와 짝).
verify_jwt = true

[functions.cancel-expired-applications]
# pg_cron이 service_role 키를 Authorization 헤더에 담아 호출합니다(sql/matching_expiry_auto_refund.sql
# 맨 아래 스케줄). service_role 키도 유효하게 서명된 JWT라 게이트웨이 검증을 통과하고, 함수 내부에서
# 한 번 더 그 키 자체인지 정확히 비교해 일반 사용자/익명 키 호출을 막습니다. 로그인한 관리자의 access
# token 도 같은 이유로 게이트웨이 검증은 통과하며, 함수 내부에서 profiles.role='admin' 을 다시 확인한
# 뒤에만 수동 실행(cron 미동작 환경에서의 테스트용) 경로를 허용합니다.
verify_jwt = true
