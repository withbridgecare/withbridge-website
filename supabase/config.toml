# 이 저장소에 Supabase CLI 프로젝트가 아직 연결되어 있지 않다면 `supabase init` / `supabase link`로
# project_id 등 나머지 설정을 채워 넣으세요. 여기서는 Edge Functions의 JWT 검증 여부만 명시합니다.

[functions.issue-virtual-account]
# 로그인한 보호자만 호출 가능 — Authorization 헤더의 Supabase 액세스 토큰을 게이트웨이가 먼저 검증합니다.
verify_jwt = true

[functions.portone-webhook]
# PortOne이 Supabase 로그인 토큰 없이 직접 호출하므로 꺼야 합니다. 대신 함수 내부에서
# PORTONE_WEBHOOK_SECRET 서명 검증 + PortOne API 재조회로 신뢰성을 확보합니다.
verify_jwt = false
